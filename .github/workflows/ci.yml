name: CI

on:
    push:
        branches: [ main, develop ]
    pull_request:
        branches: [ main ]

jobs:
    test:
        runs-on: ubuntu-latest
        
        steps:
            - name: Checkout code
              uses: actions/checkout@v4
            
            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: '22'
                  cache: 'npm'
                  
            - name: Cache npm dependencies
              id: npm-cache-modules
              uses: actions/cache@v4
              with:
                  path: "node_modules"
                  key: node_modules-${{ hashFiles('package-lock.json') }}

            - name: Install dependencies
              if: steps.npm-cache-modules.outputs.cache-hit != 'true'
              run: npm ci
              
            - name: Run tests
              run: npm test